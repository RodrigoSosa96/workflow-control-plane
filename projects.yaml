    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: standard
              cwd: .
              command: pnpm dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify
