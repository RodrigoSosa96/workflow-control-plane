version: 3
launcher:
  worktree_root: /home/you/.herdr/worktrees
  state_root: /home/you/.local/state/workflow-launcher
  delegation:
    version: 1
    totalInternal: 4
    foreground: 3
    readOnlyBackground: 3
    writersTotal: 1
    writersPerCheckout: 1
    maxDepth: 1
    remediationTurns: 2
    allowBackgroundWriters: false
  session_template: "{project}-{task}-{slug}"
  default_agent_profile: pi-worker
  max_bundle_tickets: 10
  agent_profiles:
    pi-worker:
      harness: pi
      command: pi
      mode: interactive
      roles:
        - coordinator
        - implementer
        - reviewer
      model: null
      arguments: []
    claude-worker:
      harness: claude
      command: claude
      mode: interactive
      roles:
        - coordinator
        - implementer
        - reviewer
      model: null
      permission_mode: manual
      arguments: []
    codex-worker:
      harness: codex
      command: codex
      mode: interactive
      roles:
        - coordinator
        - implementer
        - reviewer
      model: null
      sandbox: workspace-write
      approval_policy: on-request
      arguments: []
    opencode-worker:
      harness: opencode
      command: opencode
      mode: stream-json
      roles:
        - coordinator
        - implementer
        - reviewer
      model: null
      arguments: []
      availability: fixture-only
projects:
  ocr:
    label: ExampleProject
    kind: work
    path: /home/you/projects/work/example_project
    repository: monorepo
    base_branch: dev
    task_source: asana
    package_manager: pnpm
    default_agent_profile: pi-worker
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: backend
              cwd: .
              command: pnpm dev:api
            - id: frontend
              cwd: .
              command: pnpm dev:front
              split: right
              ratio: 0.5
            - id: workers
              cwd: .
              command: pnpm --filter=@app/workers dev
              split: right
    verify:
      - pnpm typecheck
      - pnpm biome:check

  acme:
    label: Acme
    kind: work
    path: /home/you/projects/work/acme
    repository: group
    task_source: asana
    default_agent_profile: pi-worker
    worktree:
      branch_template: "ticket/{task}/{slug}"
      path_template: "{worktree_root}/acme/{task}-{slug}"
    coordination:
      meta_repository: /home/you/projects/work/acme
      repos_directory: repos
    repositories:
      backend:
        path: /home/you/projects/work/acme/acme_backend
        base_branch: dev
        branch_template: "feature/{task}/{slug}"
      panel:
        path: /home/you/projects/work/acme/acme_panel
        base_branch: dev
        branch_template: "feature/{task}/{slug}"
      webapp:
        path: /home/you/projects/work/acme/acme_webapp
        base_branch: dev
        branch_template: "feature/{task}/{slug}"

  personalProjectD:
    label: PersonalProjectD
    kind: personal
    path: /home/you/projects/personal/personalProjectD
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
    default_agent_profile: pi-worker
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify

  personalProjectB:
    label: PersonalProjectB
    kind: personal
    path: /home/you/projects/personal/personalProjectB
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
    default_agent_profile: pi-worker
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: standard
              cwd: .
              command: pnpm dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify

  personalProjectC:
    label: PersonalProjectC
    kind: personal
    path: /home/you/projects/personal/personalProjectC
    repository: single
    base_branch: main
    task_source: local
    package_manager: pnpm
    default_agent_profile: pi-worker
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: development
              cwd: .
              command: pnpm dev
    verify:
      - pnpm check
      - pnpm build

  personalProjectA:
    label: PersonalProjectA
    kind: personal
    path: /home/you/projects/personal/personalProjectA
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
