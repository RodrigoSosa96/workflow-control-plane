version: 2
launcher:
  worktree_root: /home/you/.herdr/worktrees
  agent:
    command: pi
    session_template: "{project}-{task}-{slug}"
projects:
  ocr:
    label: ExampleProject
    kind: work
    path: /home/you/projects/work/example_project
    repository: monorepo
    base_branch: dev
    task_source: asana
    package_manager: pnpm
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: backend
              cwd: .
              command: pnpm dev:api
            - id: frontend
              cwd: .
              command: pnpm dev:front
              split: right
              ratio: 0.5
            - id: workers
              cwd: .
              command: pnpm --filter=@app/workers dev
              split: right
    verify:
      - pnpm typecheck
      - pnpm biome:check

  acme:
    label: Acme
    kind: work
    path: /home/you/projects/work/acme
    repository: group
    task_source: asana
    worktree:
      branch_template: "ticket/{task}/{slug}"
      path_template: "{worktree_root}/acme/{task}-{slug}"
    coordination:
      meta_repository: /home/you/projects/work/acme
      repos_directory: repos
    repositories:
      backend:
        path: /home/you/projects/work/acme/acme_backend
        base_branch: dev
        branch_template: "feature/{task}/{slug}"
      panel:
        path: /home/you/projects/work/acme/acme_panel
        base_branch: dev
        branch_template: "feature/{task}/{slug}"
      webapp:
        path: /home/you/projects/work/acme/acme_webapp
        base_branch: dev
        branch_template: "feature/{task}/{slug}"

  personalProjectD:
    label: PersonalProjectD
    kind: personal
    path: /home/you/projects/personal/personalProjectD
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify

  personalProjectB:
    label: PersonalProjectB
    kind: personal
    path: /home/you/projects/personal/personalProjectB
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: standard
              cwd: .
              command: pnpm dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify

  personalProjectC:
    label: PersonalProjectC
    kind: personal
    path: /home/you/projects/personal/personalProjectC
    repository: single
    base_branch: main
    task_source: local
    package_manager: pnpm
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: development
              cwd: .
              command: pnpm dev
    verify:
      - pnpm check
      - pnpm build

  personalProjectA:
    label: PersonalProjectA
    kind: personal
    path: /home/you/projects/personal/personalProjectA
    repository: monorepo
    base_branch: main
    task_source: local
    package_manager: pnpm
    worktree:
      branch_template: "feature/{task}/{slug}"
      path_template: "{worktree_root}/{project}/{task}-{slug}"
    runtime:
      default_profile: standard
      profiles:
        standard:
          processes:
            - id: infrastructure
              cwd: .
              command: pnpm docker:dev
            - id: standard
              cwd: .
              command: pnpm dev
            - id: full
              cwd: .
              command: pnpm dev:full
    verify:
      - pnpm ci:verify
