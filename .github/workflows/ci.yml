name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite imports .pi/extensions/*.ts directly and relies on Node's
        # native type stripping, which is on by default from 22.18.
        node-version: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Real harness canaries must never run unattended; the smoke script
          # refuses under CI, and no test may start a real agent session.
          CI: "true"
